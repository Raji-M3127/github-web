<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <div class="application-main">
            <div class="banner">
                <span class="global-banner-title">GitHub Copilot is now available for free.</span>
                <a href="#"> Learn more</a>
            </div>
            <div class="container-main">
                <div class="container-main-nav">
                    <div class="header-log">
                        <div class="image">
                            <img src="https://cdn.pixabay.com/photo/2022/01/30/13/33/github-6980894_1280.png"
                                alt="git-logo"></a>
                        </div>
                        <div class="headernav1">
                            <div class="button-container">
                                <button class="header-menu">Product
                                    <svg width="20" height="20" viewBox="0 0 200 200"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <line x1="50" y1="150" x2="100" y2="100" stroke="black" stroke-width="5" />
                                        <line x1="100" y1="100" x2="150" y2="150" stroke="black" stroke-width="5" />

                                    </svg>
                                </button>
                                <button class="header-menu" background-color="transparent">Solutions
                                    <svg width="20" height="20" viewBox="0 0 200 200"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <line x1="50" y1="150" x2="100" y2="100" stroke="black" stroke-width="5" />
                                        <line x1="100" y1="100" x2="150" y2="150" stroke="black" stroke-width="5" />
                                    </svg>

                                </button>
                                <button class="header-menu">Resources
                                    <svg width="20" height="20" viewBox="0 0 200 200"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <line x1="50" y1="150" x2="100" y2="100" stroke="black" stroke-width="5" />
                                        <line x1="100" y1="100" x2="150" y2="150" stroke="black" stroke-width="5" />
                                    </svg>
                                </button>
                                <button class="header-menu">Open Source
                                    <svg width="20" height="20" viewBox="0 0 200 200"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <line x1="50" y1="150" x2="100" y2="100" stroke="black" stroke-width="5" />
                                        <line x1="100" y1="100" x2="150" y2="150" stroke="black" stroke-width="5" />
                                    </svg>
                                </button>
                                <button class="header-menu">Enterprise
                                    <svg width="20" height="20" viewBox="0 0 200 200"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <line x1="50" y1="150" x2="100" y2="100" stroke="black" stroke-width="5" />
                                        <line x1="100" y1="100" x2="150" y2="150" stroke="black" stroke-width="5" />
                                    </svg>
                                </button>
                                <button class="header-menu">pricing
                                    <svg width="20" height="20" viewBox="0 0 200 200"
                                        xmlns="http://www.w3.org/2000/svg">
                                    </svg>
                                </button>

                            </div>
                        </div>
                        <div class="container-search">
                            <div class="header-search-btn">
                                <button>
                                    <img src="https://icons.veryicon.com/png/o/miscellaneous/big-data-regular-monochrome-icon/search-893.png"
                                        alt="search icon">
                                    <span>Search or jump to...</span>
                                    
                                </button>
                            </div>
                            <div class="signin">
                                <span>Sign in</span>
                            </div>
                            <div class="signup">
                                <button>Sign up</button>
                            </div>

                        </div>
                    </div>

                </div>
                <div class="hero">
                    <div class="hero-module">
                        <div class="heading-module">
                            <h1>Build and ship software on a single, collaborative platform</h1>
                            <p>Join the world’s most widely adopted AI-powered developer platform.</p>
                        </div>

                        <div class="frm">
                            <div class="frmcontainer">
                                <div class="mailinput">
                                    <form action="/signin" method="post">
                                        <input type="text" placeholder="Enter your email">
                                    </form>
                                </div>
                                <div class="form-button">
                                    <button>Sign up for Github</button>
                                </div>

                            </div>
                            <div class="containerfrm">
                                <div class="copbutton">
                                    <button>Try Github Copilot</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="hero-courosal-control">
                <div class="toggle-wrapper">
                    <div class="toggle-selection">
                        <div class="toggle-button">
                            <ul>
                                <li><button><span>Code</span></button></li>
                                <li><button><span>Plan</span></button></li>
                                <li><button><span>Colaborate</span></button></li>
                                <li><button><span>Automate</span></button></li>
                                <li><button><span>Secure</span></button></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    </div>
</body>

</html>
